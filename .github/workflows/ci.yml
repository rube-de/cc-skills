name: CI

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun scripts/validate-plugins.mjs
      - run: bun test ./scripts
      # The Status Line Dock's renderer is a shell script; claude plugin test can't spawn it.
      - run: bun test plugins/mods-toolbox/renderer
